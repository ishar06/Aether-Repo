<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HackOS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#000;--s1:#0C0F11;--s2:#161B1E;--s3:#242B2F;--fg:#CAF0F8;--fg2:rgba(202,240,248,.62);--fg3:rgba(202,240,248,.32);--ac:#00B4D8;--ac2:#CAF0F8;--pale:#FFFFFF;--red:#FF3B30;--line:rgba(202,240,248,.10);--glass:rgba(30,36,40,.55);color-scheme:dark}
html,body{height:100%;background:#050506;color:var(--fg);font:400 17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","SF Pro",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--fg);background:none;border:0;outline:0;width:100%}
input::placeholder,textarea::placeholder{color:var(--fg3)}
#fit{width:426px;height:898px;flex:none;transform-origin:center}
.device{position:relative;width:426px;height:898px;padding:12px;border-radius:68px;background:#0b0b0c;box-shadow:0 0 0 2px #2c2c31,0 0 0 4px #111113,0 50px 140px rgba(0,180,216,.08)}
#phone{position:relative;width:402px;height:874px;border-radius:56px;overflow:hidden;background:#000;isolation:isolate}
#island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:90}
#status{position:absolute;top:0;left:0;right:0;height:54px;padding:6px 32px 0 52px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:17px;z-index:60;pointer-events:none}
#status .r{display:flex;gap:6px;align-items:center}
#homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--fg);opacity:.85;z-index:95;pointer-events:none}
#app{position:absolute;inset:0}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);border:1px solid rgba(202,240,248,.13);box-shadow:inset 0 1px 0 rgba(202,240,248,.15),0 8px 30px rgba(0,0,0,.45)}
.ic{flex:none;display:block}
/* panes + screens */
.pane{position:absolute;inset:0;opacity:0;pointer-events:none;transform:translateY(8px) scale(.99);transition:opacity .28s,transform .28s}
.pane.on{opacity:1;pointer-events:auto;transform:none}
.screen{position:absolute;inset:0;background:#000;transition:transform .4s cubic-bezier(.22,.8,.24,1),filter .4s;box-shadow:-18px 0 40px rgba(0,0,0,.6)}
.screen.in,.screen.out{transform:translateX(104%)}
.screen.behind{transform:translateX(-26%);filter:brightness(.55)}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:118px 20px 180px;scrollbar-width:none;overscroll-behavior:contain;scroll-behavior:smooth}
.scroll::-webkit-scrollbar{display:none}
.scroll.nb{padding-bottom:130px}
.topbar{position:absolute;top:0;left:0;right:0;padding:58px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:5;background:linear-gradient(#000 60%,rgba(0,0,0,0));pointer-events:none;min-height:116px}
.topbar>*{pointer-events:auto}
.gb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.gp{height:44px;padding:0 16px;border-radius:22px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;flex:none}
.tt{font-weight:600;font-size:17px;position:absolute;left:50%;transform:translateX(-50%);top:70px;pointer-events:none!important;display:flex;gap:8px;align-items:center}
.lt{font-size:34px;font-weight:700;letter-spacing:.3px;margin:4px 4px 26px;display:flex;align-items:center;gap:12px}
/* tab bar */
#tabs{position:absolute;left:18px;right:18px;bottom:24px;height:66px;border-radius:33px;display:flex;padding:6px;gap:2px;z-index:30;transition:transform .35s cubic-bezier(.22,.8,.24,1),opacity .3s}
#tabs.hide{transform:translateY(130px);opacity:0;pointer-events:none}
.tab{flex:1;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:var(--fg2);position:relative;transition:background .25s,color .25s}
.tab.on{background:rgba(202,240,248,.14);color:var(--ac)}
.badge{position:absolute;top:5px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.dot{position:absolute;top:8px;right:calc(50% - 15px);width:9px;height:9px;border-radius:50%;background:var(--ac)}
/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:28px;overflow:hidden;margin-bottom:16px;position:relative}
.cp{padding:20px}
.tap{cursor:pointer;transition:transform .15s}
.tap:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.sp{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.c{justify-content:center;text-align:center}
.h1{font-size:22px;font-weight:700}
.h2{font-size:17px;font-weight:600}
.dim{color:var(--fg2)}.sm{font-size:13px}.xs{font-size:11px}.b{font-weight:700}
.mono{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:var(--s2);color:var(--fg);font-size:13px;font-weight:600;white-space:nowrap;transition:.2s}
.chip.acc{background:rgba(0,180,216,.18);color:var(--ac2)}
.chip.red{background:rgba(255,69,58,.16);color:var(--red)}
.chip.dim{color:var(--fg2)}
.chip.sel{background:var(--ac);color:#021a22}
.chip.lg{height:44px;border-radius:22px;padding:0 18px;font-size:15px}
.chip.off{opacity:.38}
.btn{height:54px;border-radius:27px;background:var(--ac);color:#021a22;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--s2);color:var(--fg)}
.btn.danger{background:rgba(255,69,58,.16);color:var(--red)}
.btn.strong{background:#E01B24;color:#fff;box-shadow:0 8px 24px rgba(224,27,36,.35)}
.btn.dis{opacity:.32;pointer-events:none}
.btn.busy{pointer-events:none}.btn.busy>*{opacity:0}.btn.busy:after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid rgba(2,26,34,.25);border-top-color:#021a22;animation:spin .7s linear infinite}
.btn{position:relative}
.fab{position:absolute;right:20px;bottom:104px;width:56px;height:56px;border-radius:50%;background:var(--ac);color:#021a22;display:grid;place-items:center;z-index:20;box-shadow:0 10px 28px rgba(0,180,216,.4),0 2px 6px rgba(0,0,0,.5);transition:transform .15s}
.fab:active{transform:scale(.92)}
mark{background:rgba(0,180,216,.3);color:inherit;border-radius:3px;padding:0 1px}
.flash{animation:flash 2.2s ease-out}@keyframes flash{0%,55%{outline:3px solid var(--ac);outline-offset:3px}100%{outline:3px solid transparent;outline-offset:3px}}
.cta{position:absolute;left:20px;right:20px;bottom:30px;z-index:20}
.cta .btn{box-shadow:0 10px 30px rgba(0,0,0,.6)}
.fld{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 18px;background:var(--s1);border:1px solid var(--line);border-radius:20px;margin-bottom:14px;transition:border-color .2s}
.fld:focus-within{border-color:var(--ac)}
.fld .fi{color:var(--ac2);flex:none}
.fld.ta{align-items:flex-start;padding:16px}
.fld textarea{resize:none;height:90px;line-height:1.35}
.ok{opacity:0;color:var(--ac);transform:scale(.4);transition:.28s;flex:none}.ok.on{opacity:1;transform:none}
.sw{width:51px;height:31px;border-radius:16px;background:var(--s3);position:relative;transition:.25s;flex:none}
.sw:after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--fg);transition:.25s}
.sw.on{background:var(--ac)}.sw.on:after{transform:translateX(20px);background:#fff}
.sw.lock{opacity:.35;pointer-events:none}
.lrow{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);position:relative}
.lrow:last-child{border-bottom:0}
.li{width:44px;height:44px;border-radius:14px;background:rgba(0,180,216,.14);color:var(--ac);display:grid;place-items:center;flex:none}
.av{border-radius:50%;background:rgba(0,180,216,.15);color:var(--ac);display:grid;place-items:center;font-weight:700;flex:none}
.poster{position:relative;aspect-ratio:16/10;background:#04141b}
.poster>svg{width:100%;height:100%;display:block}
.pchips{position:absolute;left:12px;bottom:12px;display:flex;gap:6px}
.pchips .chip{background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sec{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.6px;margin:32px 8px 14px;display:flex;align-items:center;gap:8px}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring>svg:not(.ic){position:absolute;inset:0}
.ring .arc{animation:ringin 1s cubic-bezier(.2,.8,.2,1) both}
.ring .in{position:relative;display:grid;place-items:center;text-align:center}
.dots{display:flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--s3)}.dots i.on{background:var(--ac)}.dots i.x{background:var(--red)}
.bar{height:10px;border-radius:5px;background:var(--s3);position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ac);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.seg{display:flex;gap:8px}
.tile{flex:1;aspect-ratio:1/1;border-radius:24px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;font-size:13px;font-weight:600}
.tile .ic{color:var(--ac)}.tile.rem .ic{color:var(--fg2)}.tile.rem.on .ic{color:var(--ac)}
.tile.sel{background:var(--ac);color:#021a22;border-color:var(--ac)}.tile.sel .ic{color:#021a22}
.tile.sel .sw{background:#021a22}.tile.sel .sw.on:after{background:var(--ac)}.tile{transition:background .25s,color .25s,border-color .25s,transform .15s}
.tile .nb{position:absolute;top:10px;right:10px}
.nb{min-width:22px;height:22px;border-radius:11px;background:var(--ac);color:#021a22;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.nb.red{background:var(--red);color:#fff}
.tb{flex:1;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:12px 0;text-align:center}
.tb b{display:block;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.tb i{font-style:normal;font-size:11px;color:var(--fg2);font-weight:600}
.tl{position:relative;padding-left:44px}
.tl .n{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--fg3);z-index:1}
.tl .n.done{background:var(--ac);color:#021a22}
.tl .n.cur{background:var(--s1);color:var(--ac);box-shadow:0 0 0 2px var(--ac);animation:pulse 2s infinite}
.tl .n.bad{background:var(--red);color:#fff}
.tl:before{content:'';position:absolute;left:15px;top:32px;bottom:-14px;width:2px;background:var(--s3)}
.tl.last:before{display:none}.tl.dn:before{background:var(--ac)}
.tl{min-height:70px}.tl:has(.chip){min-height:92px}
/* sheets */
#sheets{position:absolute;inset:0;z-index:70;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .35s;pointer-events:none}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:90%;border-radius:48px;background:rgba(14,20,24,.84);-webkit-backdrop-filter:blur(40px) saturate(1.8);backdrop-filter:blur(40px) saturate(1.8);border:1px solid rgba(202,240,248,.14);box-shadow:inset 0 1px 0 rgba(202,240,248,.15),0 -10px 60px rgba(0,0,0,.6);transform:translateY(110%);transition:transform .45s cubic-bezier(.22,.8,.24,1);overflow:hidden;display:flex;flex-direction:column;pointer-events:auto}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--fg3);margin:14px auto 4px;flex:none;position:relative;cursor:grab}.sheet .grab:before{content:"";position:absolute;inset:-14px -80px}
.sheet .sb{min-height:0;overflow-y:auto;padding:18px 24px 36px;scrollbar-width:none}
.sheet .sb::-webkit-scrollbar{display:none}
.sheet.tall{top:84px;max-height:none}
.sheet.full{left:0;right:0;bottom:0;top:0;max-height:none;border-radius:0;background:#000;border:0}
#sheets.on .scrim{opacity:1;pointer-events:auto}
#sheets.on .sheet{transform:none}
.sh-x{position:absolute;top:12px;right:14px;z-index:2}
/* alerts + banners */
#alerts{position:absolute;inset:0;z-index:85;display:none;place-items:center;background:rgba(0,0,0,.45)}
#alerts.on{display:grid;animation:fade .2s}
.alert{width:288px;border-radius:30px;background:rgba(26,32,36,.86);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);overflow:hidden;animation:pop .3s cubic-bezier(.2,1.2,.3,1);border:1px solid rgba(202,240,248,.12)}
.alert .am{padding:24px 20px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.alert h3{font-size:17px}.alert p{font-size:13px;color:var(--fg2)}
.alert .ab{display:flex;border-top:1px solid var(--line)}
.alert .ab button{flex:1;height:50px;font-weight:500}
.alert .ab button+button{border-left:1px solid var(--line);font-weight:700}
.alert .ab .d{color:var(--red)}.alert .ab .p{color:var(--ac)}
#banners{position:absolute;top:56px;left:8px;right:8px;z-index:88;pointer-events:none}
.bn{pointer-events:auto;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:30px;margin-bottom:8px;animation:bin .5s cubic-bezier(.2,1,.3,1);cursor:pointer}
.bn.out{animation:bout .35s forwards}
.bn .bi{width:40px;height:40px;border-radius:12px;background:var(--ac);color:#021a22;display:grid;place-items:center;flex:none}
.bn.red .bi{background:var(--red);color:#fff}
.bn b{font-size:15px;display:block}.bn span{font-size:13px;color:var(--fg2)}
#toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,30px);opacity:0;z-index:84;padding:12px 18px;border-radius:26px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px;transition:.35s cubic-bezier(.2,1,.3,1);pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .ic{color:var(--ac)}
/* chat */
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.m{max-width:78%;padding:10px 14px;border-radius:20px;background:var(--s2);align-self:flex-start;animation:pop .25s;font-size:16px}
.m.me{align-self:flex-end;background:var(--ac);color:#021a22;border-bottom-right-radius:6px}
.m.o{border-bottom-left-radius:6px}
.mw{display:flex;gap:8px;align-items:flex-end}
.typing i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--fg2);margin:0 2px;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.cbar{position:absolute;left:12px;right:12px;bottom:28px;height:56px;border-radius:28px;display:flex;align-items:center;padding:0 8px 0 20px;gap:8px;z-index:20}
.send{width:40px;height:40px;border-radius:50%;background:var(--ac);color:#021a22;display:grid;place-items:center;flex:none;transition:.2s}
.send.dis{opacity:.3;pointer-events:none}
/* misc */
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--red);letter-spacing:.8px}
.live:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse2 1.4s infinite}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid2>*{min-width:0}
.tc{background:var(--s1);border:1px solid var(--line);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px;position:relative;min-width:0}
.tc .nm{font-size:15px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .n{font-size:46px;font-weight:700;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;font-weight:600;color:var(--fg2)}
.stat.hi{background:var(--ac);border-color:var(--ac);color:#021a22}.stat.hi .l{color:rgba(2,26,34,.7)}.stat.hi .li{background:rgba(2,26,34,.12);color:#021a22}
.stat.lt2{background:var(--ac2);border-color:var(--ac2);color:#021a22}.stat.lt2 .l{color:rgba(2,26,34,.7)}.stat.lt2 .li{background:rgba(2,26,34,.1);color:#021a22}
.stat .li{width:36px;height:36px;border-radius:12px;margin-bottom:8px}
.tc.gone{opacity:.45}
.col2{display:flex;gap:8px;align-items:flex-end}
.col2 .cl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.col2 .bw{height:64px;width:100%;display:flex;align-items:flex-end}
.col2 .cl i{width:100%;border-radius:10px;background:var(--s3);display:block;min-height:6px;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.col2 .cl.cur i{background:var(--ac)}
.step{width:34px;height:34px;border-radius:50%;background:var(--s2);display:grid;place-items:center}
.stp{display:flex;align-items:center;gap:10px}
.stp b{min-width:28px;text-align:center;font-size:20px}
.qrbox{background:var(--fg);border-radius:28px;padding:18px;display:grid;place-items:center;position:relative}
.qrbox.reveal{animation:pop .7s cubic-bezier(.2,1.2,.3,1)}
.stamp{position:absolute;inset:0;border-radius:28px;background:rgba(202,240,248,.9);display:grid;place-items:center;color:#021a22;animation:fade .4s}
.cam{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 40%,#1a1215,#000 70%)}
.cam:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(202,240,248,.025) 0 2px,transparent 2px 5px)}
.vf{position:absolute;left:50%;top:250px;width:250px;height:250px;transform:translateX(-50%)}
.vf i{position:absolute;width:44px;height:44px;border:4px solid var(--ac);transition:.3s}
.vf i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
.vf i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 18px 0 0}
.vf i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 18px}
.vf i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 18px 0}
.vf.found i{border-color:var(--fg);transform:scale(.94)}
.laser{position:absolute;left:8px;right:8px;height:3px;border-radius:2px;background:var(--ac);box-shadow:0 0 18px 4px rgba(0,180,216,.55);animation:scan 1.8s ease-in-out infinite}
.vf .qq{position:absolute;inset:26px;display:grid;place-items:center;animation:pop .35s}
.tray{display:flex;gap:10px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.pcard{flex:none;width:92px;height:104px;border-radius:22px;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;font-size:12px;font-weight:600}
.pcard.done{opacity:.4}
.pcard .ck{position:absolute;top:6px;right:6px;color:var(--ac)}
.shake{animation:shake .4s}
.sign-bg{position:absolute;inset:0;overflow:hidden;background:radial-gradient(90% 55% at 50% 30%,rgba(0,180,216,.22),transparent 70%),#000}
.sign-bg svg{position:absolute;left:50%;top:230px;transform:translate(-50%,-50%);animation:spinslow 40s linear infinite}
.spin{animation:spin .8s linear infinite}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s .15s ease-out forwards}
.fadein{animation:fade .35s}
.up{animation:slideup .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinslow{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--ac)}50%{box-shadow:0 0 0 7px rgba(0,180,216,.18)}}
@keyframes pulse2{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
