<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="landscape">
<title>HackOS · iPad</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
i,em{font-style:normal}
:root{--bg:#000;--s1:#0C0F11;--s2:#161B1E;--s3:#242B2F;--fg:#CAF0F8;--fg2:rgba(202,240,248,.62);--fg3:rgba(202,240,248,.32);--ac:#00B4D8;--ac2:#CAF0F8;--pale:#FFFFFF;--red:#FF3B30;--line:rgba(202,240,248,.10);--glass:rgba(30,36,40,.55);color-scheme:dark}
html,body{height:100%;background:#050506;color:var(--fg);font:400 17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","SF Pro",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--fg);background:none;border:0;outline:0;width:100%}
input::placeholder,textarea::placeholder{color:var(--fg3)}
#fit{width:426px;height:898px;flex:none;transform-origin:center}
.device{position:relative;width:426px;height:898px;padding:12px;border-radius:68px;background:#0b0b0c;box-shadow:0 0 0 2px #2c2c31,0 0 0 4px #111113,0 50px 140px rgba(0,180,216,.08)}
#status{position:absolute;top:0;left:0;right:0;height:54px;padding:6px 32px 0 52px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:17px;z-index:60;pointer-events:none}
#status .r{display:flex;gap:6px;align-items:center}
#homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--fg);opacity:.85;z-index:95;pointer-events:none}
#app{position:absolute;inset:0}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);border:1px solid rgba(202,240,248,.13);box-shadow:inset 0 1px 0 rgba(202,240,248,.15),0 8px 30px rgba(0,0,0,.45)}
.ic{flex:none;display:block}
.icf{display:none!important}.tab.on .icf{display:block!important}.tab.on .ico{display:none!important}
/* panes + screens */
.pane{position:absolute;inset:0;opacity:0;pointer-events:none;transform:translateY(8px) scale(.99);transition:opacity .28s,transform .28s}
.pane.on{opacity:1;pointer-events:auto;transform:none}
.screen{position:absolute;inset:0;background:#000;transition:transform .4s cubic-bezier(.22,.8,.24,1),filter .4s;box-shadow:-18px 0 40px rgba(0,0,0,.6)}
.screen.in,.screen.out{transform:translateX(104%)}
.screen.behind{transform:translateX(-26%);filter:brightness(.55)}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:118px 20px 180px;scrollbar-width:none;overscroll-behavior:contain;scroll-behavior:smooth}
.scroll::-webkit-scrollbar{display:none}
.scroll.nb{padding-bottom:130px}
.topbar{position:absolute;top:0;left:0;right:0;padding:58px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:5;background:linear-gradient(#000 60%,rgba(0,0,0,0));pointer-events:none;min-height:116px}
.topbar>*{pointer-events:auto}
.gb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.gp{height:44px;padding:0 16px;border-radius:22px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;flex:none}
.tt{font-weight:600;font-size:17px;position:absolute;left:50%;transform:translateX(-50%);top:70px;pointer-events:none!important;display:flex;gap:8px;align-items:center}
.lt{font-size:34px;font-weight:700;letter-spacing:.3px;margin:4px 4px 26px;display:flex;align-items:center;gap:12px}
/* tab bar */
#tabs{position:absolute;left:18px;right:18px;bottom:24px;height:66px;border-radius:33px;display:flex;padding:6px;gap:2px;z-index:30;transition:transform .35s cubic-bezier(.22,.8,.24,1),opacity .3s}
#tabs.hide{transform:translateY(130px);opacity:0;pointer-events:none}
.tab{flex:1;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:var(--fg2);position:relative;transition:background .25s,color .25s}
.tab.on{background:rgba(202,240,248,.14);color:var(--ac)}
.badge{position:absolute;top:5px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font:600 12px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,sans-serif;font-style:normal;font-variant-numeric:tabular-nums;letter-spacing:0;display:grid;place-items:center;padding:0 5px}
.dot{position:absolute;top:8px;right:calc(50% - 15px);width:9px;height:9px;border-radius:50%;background:var(--ac)}
/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:28px;overflow:hidden;margin-bottom:16px;position:relative}
.cp{padding:20px}
.tap{cursor:pointer;transition:transform .15s}
.tap:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.sp{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.c{justify-content:center;text-align:center}
.h1{font-size:22px;font-weight:700}
.h2{font-size:17px;font-weight:600}
.dim{color:var(--fg2)}.sm{font-size:13px}.xs{font-size:11px}.b{font-weight:700}
.mono{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:var(--s2);color:var(--fg);font-size:13px;font-weight:600;white-space:nowrap;transition:.2s}
.chip.acc{background:rgba(0,180,216,.18);color:var(--ac2)}
.chip.red{background:rgba(255,69,58,.16);color:var(--red)}
.chip.dim{color:var(--fg2)}
.chip.sel{background:var(--ac);color:#021a22}
.chip.lg{height:44px;border-radius:22px;padding:0 18px;font-size:15px}
.chip.off{opacity:.38}
.btn{height:54px;border-radius:27px;background:var(--ac);color:#021a22;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--s2);color:var(--fg)}
.btn.danger{background:rgba(255,69,58,.16);color:var(--red)}
.btn.strong{background:#E01B24;color:#fff;box-shadow:0 8px 24px rgba(224,27,36,.35)}
.btn.dis{opacity:.32;pointer-events:none}
.btn.busy{pointer-events:none}.btn.busy>*{opacity:0}.btn.busy:after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid rgba(2,26,34,.25);border-top-color:#021a22;animation:spin .7s linear infinite}
.btn{position:relative}
.fab{position:absolute;right:20px;bottom:104px;width:56px;height:56px;border-radius:50%;background:var(--em);color:#021a22;display:grid;place-items:center;z-index:20;box-shadow:0 10px 28px rgba(16,185,129,.45),0 2px 6px rgba(0,0,0,.5);transition:transform .15s}
.fab:active{transform:scale(.92)}
mark{background:rgba(0,180,216,.3);color:inherit;border-radius:3px;padding:0 1px}
.flash{animation:flash 2.2s ease-out}@keyframes flash{0%,55%{outline:3px solid var(--ac);outline-offset:3px}100%{outline:3px solid transparent;outline-offset:3px}}
.cta{position:absolute;left:20px;right:20px;bottom:30px;z-index:20}
.cta .btn{box-shadow:0 10px 30px rgba(0,0,0,.6)}
.fld{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 18px;background:var(--s1);border:1px solid var(--line);border-radius:20px;margin-bottom:14px;transition:border-color .2s}
.fld:focus-within{border-color:var(--ac)}
.fld .fi{color:var(--ac2);flex:none}
.fld.ta{align-items:flex-start;padding:16px}
.fld textarea{resize:none;height:90px;line-height:1.35}
.ok{opacity:0;color:var(--ac);transform:scale(.4);transition:.28s;flex:none}.ok.on{opacity:1;transform:none}
.sw{width:51px;height:31px;border-radius:16px;background:var(--s3);position:relative;transition:.25s;flex:none}
.sw:after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--fg);transition:.25s}
.sw.on{background:var(--ac)}.sw.on:after{transform:translateX(20px);background:#fff}
.sw.lock{opacity:.35;pointer-events:none}
.lrow{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);position:relative}
.lrow:last-child{border-bottom:0}
.li{width:44px;height:44px;border-radius:14px;background:rgba(0,180,216,.14);color:var(--ac);display:grid;place-items:center;flex:none}
.av{border-radius:50%;background:rgba(0,180,216,.15);color:var(--ac);display:grid;place-items:center;font-weight:700;flex:none}
.poster{position:relative;aspect-ratio:16/10;background:#04141b}
.poster>svg{width:100%;height:100%;display:block}
.pchips{position:absolute;left:12px;bottom:12px;display:flex;gap:6px}
.pchips .chip{background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sec{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.6px;margin:32px 8px 14px;display:flex;align-items:center;gap:8px}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring>svg:not(.ic){position:absolute;inset:0}
.ring .arc{animation:ringin 1s cubic-bezier(.2,.8,.2,1) both}
.ring .in{position:relative;display:grid;place-items:center;text-align:center}
.dots{display:flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--s3)}.dots i.on{background:var(--ac)}.dots i.x{background:var(--red)}
.bar{height:10px;border-radius:5px;background:var(--s3);position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ac);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.seg{display:flex;gap:8px}
.tile{flex:1;aspect-ratio:1/1;border-radius:24px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;font-size:13px;font-weight:600}
.tile .ic{color:var(--ac)}.tile.rem .ic{color:var(--fg2)}.tile.rem.on .ic{color:var(--ac)}
.tile.sel{background:var(--ac);color:#021a22;border-color:var(--ac)}.tile.sel .ic{color:#021a22}
.tile.sel .sw{background:#021a22}.tile.sel .sw.on:after{background:var(--ac)}.tile{transition:background .25s,color .25s,border-color .25s,transform .15s}
.tile .nb{position:absolute;top:10px;right:10px}
.nb{min-width:22px;height:22px;border-radius:11px;background:var(--ac);color:#021a22;font:600 13px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,sans-serif;font-style:normal;font-variant-numeric:tabular-nums;display:grid;place-items:center;padding:0 6px}
.nb.red{background:var(--red);color:#fff}
.tb{flex:1;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:12px 0;text-align:center}
.tb b{display:block;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.tb i{font-style:normal;font-size:11px;color:var(--fg2);font-weight:600}
.tl{position:relative;padding-left:44px}
.tl .n{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--fg3);z-index:1}
.tl .n.done{background:var(--ac);color:#021a22}
.tl .n.cur{background:var(--s1);color:var(--ac);box-shadow:0 0 0 2px var(--ac);animation:pulse 2s infinite}
.tl .n.bad{background:var(--red);color:#fff}
.tl:before{content:'';position:absolute;left:15px;top:32px;bottom:-14px;width:2px;background:var(--s3)}
.tl.last:before{display:none}.tl.dn:before{background:var(--ac)}
.tl{min-height:70px}.tl:has(.chip){min-height:92px}
/* sheets */
#sheets{position:absolute;inset:0;z-index:70;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .35s;pointer-events:none}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:90%;border-radius:48px;background:rgba(14,20,24,.84);-webkit-backdrop-filter:blur(40px) saturate(1.8);backdrop-filter:blur(40px) saturate(1.8);border:1px solid rgba(202,240,248,.14);box-shadow:inset 0 1px 0 rgba(202,240,248,.15),0 -10px 60px rgba(0,0,0,.6);transform:translateY(110%);transition:transform .45s cubic-bezier(.22,.8,.24,1);overflow:hidden;display:flex;flex-direction:column;pointer-events:auto}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--fg3);margin:14px auto 4px;flex:none;position:relative;cursor:grab}.sheet .grab:before{content:"";position:absolute;inset:-14px -80px}
.shh{display:flex;align-items:center;gap:12px;padding:8px 20px 4px;flex:none;min-height:56px;position:relative}
.shh .sht{position:absolute;left:88px;right:88px;text-align:center;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.shh .shs{display:flex;align-items:center;min-width:44px;position:relative;z-index:1}.shh .shs.r{margin-left:auto;justify-content:flex-end}
.shh .gb{width:44px;height:44px}.shh+.sb{padding-top:10px}
.lkart{position:relative;width:170px;height:170px;display:grid;place-items:center}.lkart i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(0,180,216,.4);animation:lkp 3.2s ease-out infinite}.lkart i+i{inset:24px;animation-delay:1.1s}
.lkart .lk{position:relative;width:92px;height:92px;border-radius:32px;background:linear-gradient(145deg,rgba(0,180,216,.34),rgba(0,180,216,.08));box-shadow:0 10px 40px rgba(0,180,216,.28),inset 0 1px 0 rgba(255,255,255,.18)}
.lkart .lkb{position:absolute;right:-8px;bottom:-8px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#0b1a21;color:var(--ac2);border:1px solid rgba(202,240,248,.25)}
@keyframes lkp{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.15);opacity:0}}
.sheet .sb{min-height:0;overflow-y:auto;padding:18px 24px 36px;scrollbar-width:none}
.sheet .sb::-webkit-scrollbar{display:none}
.sheet.tall{top:84px;max-height:none}
.sheet.full{left:0;right:0;bottom:0;top:0;max-height:none;border-radius:0;background:#000;border:0}
#sheets.on .scrim{opacity:1;pointer-events:auto}
#sheets.on .sheet{transform:none}
.sh-x{position:absolute;top:12px;right:14px;z-index:2}
/* alerts + banners */
#alerts{position:absolute;inset:0;z-index:85;display:none;place-items:center;background:rgba(0,0,0,.45)}
#alerts.on{display:grid;animation:fade .2s}
.alert{width:288px;border-radius:30px;background:rgba(26,32,36,.86);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);overflow:hidden;animation:pop .3s cubic-bezier(.2,1.2,.3,1);border:1px solid rgba(202,240,248,.12)}
.alert .am{padding:24px 20px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.alert h3{font-size:17px}.alert p{font-size:13px;color:var(--fg2)}
.alert .ab{display:flex;border-top:1px solid var(--line)}
.alert .ab button{flex:1;height:50px;font-weight:500}
.alert .ab button+button{border-left:1px solid var(--line);font-weight:700}
.alert .ab .d{color:var(--red)}.alert .ab .p{color:var(--ac)}
#banners{position:absolute;top:56px;left:8px;right:8px;z-index:88;pointer-events:none}
.bn{pointer-events:auto;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:30px;margin-bottom:8px;animation:bin .5s cubic-bezier(.2,1,.3,1);cursor:pointer}
.bn.out{animation:bout .35s forwards}
.bn .bi{width:40px;height:40px;border-radius:12px;background:var(--ac);color:#021a22;display:grid;place-items:center;flex:none}
.bn.red .bi{background:var(--red);color:#fff}
.bn b{font-size:15px;display:block}.bn span{font-size:13px;color:var(--fg2)}
#toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,30px);opacity:0;z-index:84;padding:12px 18px;border-radius:26px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px;transition:.35s cubic-bezier(.2,1,.3,1);pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .ic{color:var(--ac)}
/* chat */
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.m{max-width:78%;padding:10px 14px;border-radius:20px;background:var(--s2);align-self:flex-start;animation:pop .25s;font-size:16px}
.m.me{align-self:flex-end;background:var(--ac);color:#021a22;border-bottom-right-radius:6px}
.m.o{border-bottom-left-radius:6px}
.mw{display:flex;gap:8px;align-items:flex-end}
.typing i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--fg2);margin:0 2px;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.cbar{position:absolute;left:12px;right:12px;bottom:28px;height:56px;border-radius:28px;display:flex;align-items:center;padding:0 8px 0 20px;gap:8px;z-index:20}
.send{width:40px;height:40px;border-radius:50%;background:var(--ac);color:#021a22;display:grid;place-items:center;flex:none;transition:.2s}
.send.dis{opacity:.3;pointer-events:none}
/* misc */
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--red);letter-spacing:.8px}
.live:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse2 1.4s infinite}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid2>*{min-width:0}
.tc{background:var(--s1);border:1px solid var(--line);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px;position:relative;min-width:0}
.tc .nm{font-size:15px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .n{font-size:46px;font-weight:700;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;font-weight:600;color:var(--fg2)}
.stat.hi{background:var(--ac);border-color:var(--ac);color:#021a22}.stat.hi .l{color:rgba(2,26,34,.7)}.stat.hi .li{background:rgba(2,26,34,.12);color:#021a22}
.stat.lt2{background:var(--ac2);border-color:var(--ac2);color:#021a22}.stat.lt2 .l{color:rgba(2,26,34,.7)}.stat.lt2 .li{background:rgba(2,26,34,.1);color:#021a22}
.stat .li{width:36px;height:36px;border-radius:12px;margin-bottom:8px}
.tc.gone{opacity:.45}
.col2{display:flex;gap:8px;align-items:flex-end}
.col2 .cl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.col2 .bw{height:112px;width:100%;display:flex;align-items:flex-end}
.col2 .cl i{width:100%;border-radius:10px;background:var(--s3);display:block;min-height:6px;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.col2 .cl.cur i{background:var(--ac)}
.step{width:34px;height:34px;border-radius:50%;background:var(--s2);display:grid;place-items:center}
.stp{display:flex;align-items:center;gap:10px}
.stp b{min-width:28px;text-align:center;font-size:20px}
.qrbox{background:var(--fg);border-radius:28px;padding:18px;display:grid;place-items:center;position:relative}
.qrbox.reveal{animation:pop .7s cubic-bezier(.2,1.2,.3,1)}
.stamp{position:absolute;inset:0;border-radius:28px;background:rgba(202,240,248,.9);display:grid;place-items:center;color:#021a22;animation:fade .4s}
.cam{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 40%,#1a1215,#000 70%)}
.cam:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(202,240,248,.025) 0 2px,transparent 2px 5px)}
.vf{position:absolute;left:50%;top:250px;width:250px;height:250px;transform:translateX(-50%)}
.vf i{position:absolute;width:44px;height:44px;border:4px solid var(--ac);transition:.3s}
.vf i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
.vf i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 18px 0 0}
.vf i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 18px}
.vf i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 18px 0}
.vf.found i{border-color:var(--fg);transform:scale(.94)}

/* ===== Palette upgrade: emerald / blue / pink + blue surfaces ===== */
:root{--em:#10B981;--evb:#00B4D8;--pink:#F472B6;--vink:#021a22;
--s1:#07202b;--s2:#0d2d3b;--s3:#16404f;--glass:rgba(10,38,50,.58);
--g-surf:linear-gradient(155deg,#0b2f40 0%,#06202c 55%,#051721 100%);
--g-deep:linear-gradient(180deg,#0a2a3a 0%,#041219 100%);
--sh-card:0 10px 28px rgba(0,0,0,.45),0 2px 6px rgba(0,60,80,.25)}
.screen,.land{background:radial-gradient(120% 38% at 50% 0%,rgba(0,180,216,.14),transparent 70%),#020a0e}
.topbar{background:linear-gradient(#020a0e 60%,rgba(2,10,14,0))}
/* surfaces: blue gradient cards */
.card,.tc,.stat,.tb,.otp i{background:var(--g-surf);box-shadow:var(--sh-card),inset 0 1px 0 rgba(202,240,248,.07)}
.fld{background:var(--s1);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.sheet{background:linear-gradient(180deg,rgba(11,44,58,.9),rgba(5,22,30,.92));box-shadow:inset 0 1px 0 rgba(202,240,248,.15),0 -10px 60px rgba(0,0,0,.6),0 -2px 40px rgba(0,180,216,.1)}
.sheet.full{background:var(--g-deep)}
.alert{background:linear-gradient(180deg,rgba(14,48,62,.92),rgba(6,26,35,.92));box-shadow:0 24px 60px rgba(0,0,0,.55)}
.ddm{background:rgba(9,36,48,.94)}
.mgt th{background:#0a2330}.mgt td{background:#05161e}
/* shadows on key text + controls */
.lt,.h1,.mg-t{text-shadow:0 2px 14px rgba(0,180,216,.28)}
.stat .n,.tb b{text-shadow:0 2px 12px rgba(0,0,0,.4)}
.stat.hi .n,.stat.lt2 .n,.stat.em .n{text-shadow:none}
.btn:not(.ghost):not(.danger):not(.dis),.lbtn{box-shadow:0 8px 22px rgba(0,180,216,.3)}
.btn.ghost{box-shadow:0 4px 14px rgba(0,0,0,.3)}
.tab.on{box-shadow:inset 0 1px 0 rgba(202,240,248,.18),0 4px 14px rgba(0,0,0,.3)}
.stat.hi{background:linear-gradient(150deg,#22d3ee,#00B4D8 55%,#0090ad);box-shadow:0 12px 28px rgba(0,180,216,.35)}
/* emerald: success / completed */
.chip.em{background:rgba(16,185,129,.18);color:#6ee7b7}
.stat.em{background:linear-gradient(150deg,#34d399,#10B981 60%,#0a8f66);border-color:var(--em);color:#032a1d;box-shadow:0 12px 28px rgba(16,185,129,.32)}
.stat.em .l{color:rgba(3,42,29,.72)}.stat.em .li{background:rgba(3,42,29,.14);color:#032a1d}
.tl .n.done{background:var(--em);color:#032a1d;box-shadow:0 4px 12px rgba(16,185,129,.35)}
.tl.dn:before{background:var(--em)}
.ok.on{color:var(--em)}
.pcard .ck{color:var(--em)}
.mgb.ad{background:var(--em);color:#032a1d}
#toast .ic{color:var(--em)}
.bn .bi{background:var(--em);color:#032a1d}.bn.red .bi{background:var(--red);color:#fff}
/* pink: achievements / winners / highlights */
.chip.pink{background:rgba(244,114,182,.2);color:#f9a8d4}
.pchips .chip.pink{background:rgba(60,8,36,.62);color:#fbcfe8}
.nb.pink{background:var(--pink);color:#3a0820}
/* primary blue: anything that belongs to an event */
.card.ev{background:var(--ac);border-color:rgba(255,255,255,.3);color:var(--vink);box-shadow:0 6px 14px rgba(0,0,0,.4),0 2px 10px rgba(0,180,216,.2),inset 0 1px 0 rgba(255,255,255,.14)}
.lrow.ev{background:var(--ac);color:var(--vink);border-bottom-color:rgba(2,26,34,.14)}
.fld.ev{background:var(--ac);color:var(--vink);border-color:rgba(255,255,255,.3);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.ev .dim:not(.chip),.ev .fi{color:rgba(2,26,34,.7)}
.ev .h1,.ev .h2,.ev b{color:var(--vink);text-shadow:none}
.ev .chip{background:rgba(2,26,34,.8);color:#CAF0F8}
.ev .chip.pink{background:rgba(2,26,34,.8);color:#f9a8d4}
.ev .chip.em{background:var(--em);color:#032a1d}
.ev .chip.acc{background:rgba(2,26,34,.8);color:#7be3f5}
.ev .chip.dim{background:rgba(2,26,34,.14);color:rgba(2,26,34,.8)}
.ev .chip.red{background:rgba(255,59,48,.9);color:#fff}
.ev .ic{color:inherit}
.lrow.ev .poster,.card.ev .poster{box-shadow:0 3px 8px rgba(2,26,34,.35)}

/* native Sign in with Apple (white style) */
.btn.appbtn{background:#fff;color:#000;box-shadow:none;min-height:54px;padding:0 24px;gap:6px;font-weight:600;font-size:19px;letter-spacing:-.2px;border-radius:27px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
.btn.appbtn .ic{margin-top:-2px;margin-right:2px}
/* sheets: solid black with a visible edge */
.sheet{background:#000;-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid rgba(202,240,248,.3);box-shadow:0 0 0 1px rgba(0,0,0,.9),0 -6px 34px rgba(0,180,216,.22),0 -18px 70px rgba(0,0,0,.85),inset 0 1px 0 rgba(202,240,248,.22)}
.sheet.full{background:#000;border:0;box-shadow:none}
/* individual items: plain dark with a blue shadow */
.card:not(.ev),.tc,.stat:not(.hi):not(.lt2):not(.em),.tb{background:#070d11;border-color:rgba(0,180,216,.16);box-shadow:0 6px 20px rgba(0,180,216,.14),0 2px 6px rgba(0,0,0,.5)}
/* emerald buttons */
.btn.em{background:var(--em);color:#032a1d;box-shadow:0 8px 22px rgba(16,185,129,.3)}
.btn.em.dis{box-shadow:none}
/* iPad layout keeps its own landing glow + hover */
.land{background:radial-gradient(45% 55% at 50% 38%,rgba(0,180,216,.2),transparent 70%),#020a0e}
.mgt tbody tr:hover td{background:#0a1e28}
/* selected rows keep their highlight over the new surfaces */
.selrow.card:not(.ev){border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 6px 20px rgba(0,180,216,.14)}
.selrow.card.ev{box-shadow:0 0 0 2px #fff,0 6px 14px rgba(0,0,0,.4)}
.selrow.lrow:not(.ev){background:rgba(0,180,216,.14)}
.selrow.lrow.ev{box-shadow:inset 0 0 0 3px #fff}

/* edit-event sheet + poster action button */
.pbtn{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);border:1px solid rgba(255,255,255,.3);box-shadow:0 2px 10px rgba(0,0,0,.4);z-index:2}
.pbtn.ro{pointer-events:none}
.sheet.tall>.sb:has(#eov){position:relative}
#eov{position:absolute;inset:0;overflow:hidden}
#eov .topbar{padding-top:10px;min-height:68px}
#eov .tt{top:22px}
#eov .scroll{padding-top:72px}
#eov .cta:not(.cta-in){bottom:26px!important}
/* poster capsules: frosted dark pill + light edge, legible on light and dark posters */
.pchips .chip,.ev .pchips .chip{background:rgba(0,0,0,.52);color:#fff;border:1px solid rgba(255,255,255,.28);box-shadow:0 2px 8px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6)}
.pchips .chip.dim,.ev .pchips .chip.dim{color:#fff}
.pchips .chip.acc,.ev .pchips .chip.acc{color:#7be3f5}
.pchips .chip.em,.ev .pchips .chip.em{background:rgba(0,0,0,.52);color:#6ee7b7}
.pchips .chip.red,.ev .pchips .chip.red{background:rgba(0,0,0,.52);color:#ff9a92}
.pchips .chip.pink,.ev .pchips .chip.pink{background:rgba(0,0,0,.52);color:#fbcfe8}
/* event cards: glass surface */
.card.ev{background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);border:1px solid rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 30px rgba(0,0,0,.4)}
.card.ev .h1,.card.ev .h2,.card.ev b{color:#fff}
.card.ev .dim:not(.chip),.card.ev .fi{color:rgba(255,255,255,.7)}
.card.ev .cp .chip,.card.ev .cp .chip.dim{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.16)}
.card.ev .cp .chip.acc{color:#7be3f5}

/* ---- v6: static vs tappable capsules, sheet header fade, messages ---- */
.chip.st{background:transparent;box-shadow:inset 0 0 0 1px rgba(202,240,248,.22);pointer-events:none;cursor:default}
.chip.edit{background:#fff;color:#04141b;cursor:pointer;box-shadow:0 2px 12px rgba(255,255,255,.22);transition:transform .15s,opacity .15s}.chip.edit:active{transform:scale(.94);opacity:.85}
.pbtn:not(.ro){background:#fff;color:#04141b;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 2px 10px rgba(0,0,0,.45)}
button:focus-visible,[role=button]:focus-visible,.conv:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.shh{z-index:3}.shh::after{content:"";position:absolute;left:0;right:0;top:100%;height:26px;background:linear-gradient(#000,rgba(0,0,0,0));pointer-events:none}
.shh+.sb{padding-top:26px}
.sheet.tall .shh::after{display:none}
.sheet .fsc::before{content:"";display:block;position:sticky;top:0;height:22px;margin-bottom:-22px;background:linear-gradient(#000,rgba(0,0,0,0));z-index:2;pointer-events:none}
.sheet.tall .shh+.sb{padding-top:0}
.lrow.ev.locked{filter:grayscale(1);opacity:.62}
.conv{display:flex;gap:14px;align-items:center;padding:12px 8px 12px 16px;min-height:76px;cursor:pointer}
.conv+.conv{border-top:1px solid var(--line)}
.conv .ctile{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,rgba(0,180,216,.42),rgba(0,180,216,.12));color:var(--ac2)}
.conv .ctile .av{width:56px!important;height:56px!important;font-size:22px!important}
.conv .cmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding-right:12px}
.conv .crow{display:flex;align-items:center;gap:8px;min-width:0}
.conv .ctitle{flex:1;min-width:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .ctime{font-size:14px;color:var(--fg2);flex:none}
.conv .cmeta{font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .csub{flex:1;min-width:0;font-size:15px;line-height:1.3;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.conv .csub b{color:var(--fg);font-weight:600}
.conv.unr .csub{color:var(--fg)}.conv.locked{opacity:.72}
.msgs{gap:12px}.mw{display:flex;align-items:flex-end;gap:10px}.mw .av{margin-bottom:0}
.mcol{display:flex;flex-direction:column;gap:3px;max-width:80%;min-width:0}.mn{font-size:13px;font-weight:600;color:var(--fg2);padding-left:14px}
.mw .m{max-width:100%}.m{font-size:17px;line-height:1.3;padding:9px 15px}
.send{width:44px;height:44px}.cbar{height:60px}.cbar input{font-size:17px}
.cbar.lockbar{justify-content:center;gap:10px;color:var(--fg2);font-size:15px;padding:0 20px;text-align:center}
@media (prefers-reduced-motion:reduce){.m,.lkart i,.sheet{animation:none!important;transition-duration:0s!important}}

/* ---- v7: chat aurora + empty event picker ---- */
.send{background:transparent;color:var(--ac)}.send svg{display:block}
.mn{color:var(--fg);text-shadow:0 1px 8px rgba(0,0,0,.8)}
.cfx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.cfx i{position:absolute;left:0;top:0;border-radius:50%;will-change:transform,opacity}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:8px 8px 20px}
.pickpill{border-color:rgba(0,180,216,.55)!important;animation:pkpulse 2.4s ease-in-out infinite}
.pickart{position:relative;width:260px;height:260px;margin:14px 0 6px;display:grid;place-items:center}
.pickart .pk-glow{position:absolute;inset:14%;border-radius:50%;background:conic-gradient(from 0deg,#10B981,#0A84FF,#F472B6,#CAF0F8,#10B981);filter:blur(34px);opacity:.55;animation:pkspin 10s linear infinite}
.pickart .pk-ring{position:absolute;border-radius:50%;border:1px solid rgba(202,240,248,.22);inset:0}.pickart .pk-ring.r2{inset:20%;border-color:rgba(0,180,216,.4)}
.pickart .pk-ring.r1{animation:pkexp 3.6s ease-out infinite}.pickart .pk-ring.r2{animation:pkexp 3.6s ease-out 1.2s infinite}
.pickart .pk-orbit{position:absolute;inset:0;animation:pkspin 22s linear infinite}
.pickart .pk-orb{position:absolute;width:48px;height:48px;margin:-24px;border-radius:16px;display:grid;place-items:center;background:rgba(14,20,24,.85);border:1px solid rgba(202,240,248,.22);color:var(--ac2);animation:pkspin 22s linear infinite reverse;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.pickart .pk-core{position:relative;width:104px;height:104px;border-radius:36px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#10B981,#0A84FF 55%,#F472B6);background-size:200% 200%;animation:pkfloat 4s ease-in-out infinite,pkshift 6s ease-in-out infinite;box-shadow:0 16px 50px rgba(10,132,255,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.pk-t{font-size:28px;font-weight:700;letter-spacing:.2px;background:linear-gradient(90deg,#10B981,#0A84FF,#F472B6,#10B981);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:pkshift 6s linear infinite}
.pk-s{max-width:290px;font-size:16px;color:var(--fg2)}
@keyframes pkspin{to{transform:rotate(360deg)}}@keyframes pkexp{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.12);opacity:0}}
@keyframes pkfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pkshift{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes pkpulse{0%,100%{box-shadow:0 0 0 0 rgba(0,180,216,.45)}50%{box-shadow:0 0 0 8px rgba(0,180,216,0)}}
@media (prefers-reduced-motion:reduce){.pickart *,.pk-t,.pickpill{animation:none!important}}
/* v7: white event pickers + FABs, white selected capsules, create-event steps */
.fld.ev{background:#fff;color:#04141b;border-color:rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(255,255,255,.12)}
.fld.ev .fi,.fld.ev .dim,.fld.ev b{color:#04141b}
.pickpill{border-color:rgba(255,255,255,.9)!important;animation:pkpulseW 2.4s ease-in-out infinite}
@keyframes pkpulseW{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}50%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
.btn.white{background:#fff;color:#04141b;box-shadow:0 8px 22px rgba(255,255,255,.16)}
.fab{background:#fff;color:#04141b;box-shadow:0 10px 28px rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.5)}
.chip.lg.sel{background:#fff;color:#04141b}
.ndp{margin:0 4px 22px}.ndp .k{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--fg2)}.ndp .n{font-size:28px;font-weight:700;letter-spacing:.2px;margin:2px 0 14px}
.ndsegs{display:flex;gap:6px}.ndsegs i{position:relative;flex:1;height:6px;border-radius:3px;background:var(--s3);transition:background .25s}.ndsegs i.done{background:var(--ac);cursor:pointer}.ndsegs i.cur{background:#fff}.ndsegs i::after{content:'';position:absolute;inset:-14px 0}
@media (prefers-reduced-motion:reduce){.pickpill{animation:none!important}}
/* v8: white event rows + buttons, no close crosses */
.chip.wb{background:#fff;color:#04141b;box-shadow:0 2px 12px rgba(255,255,255,.22);cursor:pointer}.chip.wb:active{transform:scale(.94);opacity:.85}
.gp.wbtn{background:#fff;color:#04141b;border:0;box-shadow:0 2px 12px rgba(255,255,255,.2)}
.whc{background:#fff!important;border-color:#fff!important;color:#04141b;--fg:#04141b;--fg2:rgba(4,20,27,.62);--fg3:rgba(4,20,27,.4);--line:rgba(4,20,27,.12);--ac2:#04141b;--ac:#0089a8;box-shadow:0 8px 26px rgba(255,255,255,.12),0 2px 6px rgba(0,0,0,.4)!important}
.whc .li{background:rgba(4,20,27,.09);color:#04141b}
.whs .accd,.whs .card,.dkw{--ac:#fff;background:rgba(8,13,16,.78)!important;-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);border:1px solid rgba(255,255,255,.14)!important;color:#fff;--fg:#fff;--ac2:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.5)!important}
.whs .li,.dkw .li{background:rgba(255,255,255,.1);color:#fff}
.whs .accd .chip.lg.sel{background:#fff;color:#04141b}
.whs .card .ic,.whs .accd .ic,.whc .ic,.dkw .ic{stroke:currentColor;stroke-width:3.5;stroke-linejoin:round}
.lrow.ev{background:#fff;color:#04141b;border-bottom-color:rgba(4,20,27,.1)}
.lrow.ev .dim:not(.chip),.lrow.ev .fi{color:rgba(4,20,27,.62)}
/* v9: participant event theme */
.wchips .chip:not(.off):not(.red){background:#fff;color:#04141b}
.wchips .tl .n.done{background:#fff;color:#04141b;box-shadow:none}

html,body{overscroll-behavior:none}

/* v11: stage builder, edit team, year symbol */
.chip.wb.rd{color:#d70015}

/* v12: team details sheet */
.btn.rf{background:rgba(8,13,16,.78);border:1px solid rgba(255,255,255,.14);color:#FF453A;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
a.chip{text-decoration:none}

.nosh .btn,.nosh .btn.rf,.nosh .btn.em,.nosh .btn.danger{box-shadow:none!important;text-shadow:none}

.stat.hi .rp-bar,.stat.em .rp-bar,.stat.pk .rp-bar,.stat.wt .rp-bar{background:rgba(0,0,0,.16)}
.stat.hi .rp-bar i,.stat.em .rp-bar i,.stat.pk .rp-bar i,.stat.wt .rp-bar i{background:rgba(2,26,34,.78)}
.rp-hero{position:relative;overflow:hidden;border-radius:32px;padding:24px;background:linear-gradient(145deg,#0b3d4e,#06202b 55%,#04141b);border:1px solid rgba(0,180,216,.35);display:flex;align-items:center;gap:18px;margin-bottom:16px;box-shadow:0 16px 40px rgba(0,180,216,.18)}

/* landing: slow binary rain. Each column has a head drifting down; every cell it passes shows a 0/1 that eases in, then eases out. */
function binRain(land){
 if(!land||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const cv=document.createElement('canvas');cv.className='rain';land.prepend(cv);
 const g=cv.getContext('2d'),CW=24,CH=26,MAXA=.34,ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
 let W=0,H=0,cols=[],last=performance.now();
 const size=()=>{const r=land.getBoundingClientRect(),k=devicePixelRatio||1,s=land.offsetWidth?r.width/land.offsetWidth:1;W=land.offsetWidth;H=land.offsetHeight;cv.width=W*k;cv.height=H*k;g.setTransform(k,0,0,k,0,0);
  const n=Math.ceil(W/CW);cols=Array.from({length:n},(_,i)=>cols[i]||{head:Math.random()*H*.5-120,v:30+Math.random()*40,cells:{}})};
 size();
 const tick=now=>{
  if(!cv.isConnected)return;
  if(land.offsetWidth!==W||land.offsetHeight!==H)size();
  const dt=Math.min(.05,(now-last)/1000);last=now;
  g.clearRect(0,0,W,H);g.font='500 15px ui-monospace,"SF Mono",Menlo,monospace';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#00B4D8';
  cols.forEach((c,i)=>{
   const r0=Math.floor(c.head/CH);c.head+=c.v*dt;const r1=Math.floor(c.head/CH);
   for(let r=r0+1;r<=r1;r++)if(r>=0&&Math.random()<.7)c.cells[r]={b:Math.random()<.5?'0':'1',t0:now,life:3200+Math.random()*3200};
   if(c.head>H+CH*4){c.head=-Math.random()*200;c.v=30+Math.random()*40;c.cells={}}
   for(const r in c.cells){const e=c.cells[r],p=(now-e.t0)/e.life;if(p>=1){delete c.cells[r];continue}
    const a=MAXA*ease(p<.3?p/.3:1-(p-.3)/.7);g.globalAlpha=a;g.fillText(e.b,i*CW+CW/2,r*CH+CH/2)}
  });
  g.globalAlpha=1;requestAnimationFrame(tick)};
 requestAnimationFrame(tick)}

SH.manage=()=>{const mg=S.mg||(S.mg={stage:stageIdx(),q:''}),N=S.stages.length,si=Math.min(Math.max(0,mg.stage),N-1),cur=stageIdx(),L=bySub(baseTL('all'),si),out=L.filter(t=>t.elim).length;
